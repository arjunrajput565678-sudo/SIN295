<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>SIN295 Chat</title>
  <style>
    body, html { height: 100%; margin: 0; font-family: sans-serif; }
    /* हमने यहाँ एक पक्का इमेज लिंक दिया है जो काम करेगा */
    body { 
      background-image: url('https://images.unsplash.com/photo-1634563853154-180413158b76?q=80&w=1000&auto=format&fit=crop'); 
      background-size: cover;
      background-position: center;
      display: flex; justify-content: center; align-items: center;
    }
    .app-container { width: 90%; max-width: 400px; background: rgba(0, 0, 0, 0.85); color: white; border-radius: 15px; padding: 20px; border: 1px solid #ffd700; box-shadow: 0 0 15px #ffd700; }
    .header { text-align: center; font-size: 28px; font-weight: bold; color: #ffd700; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 5px; border: none; background: #222; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #ffd700; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    .chat-box { height: 250px; overflow-y: auto; background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 5px; margin-top: 10px; }
    .msg { background: #333; padding: 8px; margin: 5px 0; border-radius: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">SIN295</div>

  <!-- लॉगिन/साइनअप -->
  <div id="authArea">
    <h3 id="formTitle">लॉगिन करें</h3>
    <input type="email" id="email" placeholder="ईमेल">
    <input type="password" id="pass" placeholder="पासवर्ड">
    <button onclick="handleAuth()" id="mainBtn">लॉगिन</button>
    <p onclick="toggleMode()" style="cursor:pointer; text-align:center; color:#ffd700; margin-top:10px;" id="toggleText">अकाउंट नहीं है? साइन-अप</p>
  </div>

  <!-- चैट -->
  <div id="chatArea" class="hidden">
    <input type="text" id="roomName" placeholder="रूम का नाम">
    <button onclick="joinRoom()">रूम में जुड़ें</button>
    <div class="chat-box" id="chatBox"></div>
    <div style="display:flex; gap:5px;">
        <input type="text" id="msgInput" placeholder="मैसेज...">
        <button onclick="send()" style="margin-top:0; width:60px;">➤</button>
    </div>
    <button onclick="firebase.auth().signOut()" style="background:#ff4444;">लॉगआउट</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  const config = {
    apiKey: "AIzaSyCdvQCtWPHCTiwOaxpNhm7I9pI9J6YkHj0",
    authDomain: "sin295.firebaseapp.com",
    databaseURL: "https://sin295-default-rtdb.firebaseio.com",
    projectId: "sin295",
    storageBucket: "sin295.firebasestorage.app",
    messagingSenderId: "563305243132",
    appId: "1:563305243132:web:04bcaa9499d1fe4c8f9279"
  };
  firebase.initializeApp(config);
  
  let isSignup = false;
  function toggleMode() {
    isSignup = !isSignup;
    document.getElementById('formTitle').innerText = isSignup ? "साइन-अप करें" : "लॉगिन करें";
    document.getElementById('mainBtn').innerText = isSignup ? "साइन-अप" : "लॉगिन";
    document.getElementById('toggleText').innerText = isSignup ? "अकाउंट है? लॉगिन करें" : "अकाउंट नहीं है? साइन-अप";
  }

  function handleAuth() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    if(isSignup) firebase.auth().createUserWithEmailAndPassword(e, p).catch(err=>alert(err.message));
    else firebase.auth().signInWithEmailAndPassword(e, p).catch(err=>alert(err.message));
  }

  firebase.auth().onAuthStateChanged(user => {
    if(user) {
        document.getElementById('authArea').classList.add('hidden');
        document.getElementById('chatArea').classList.remove('hidden');
    } else {
        document.getElementById('authArea').classList.remove('hidden');
        document.getElementById('chatArea').classList.add('hidden');
    }
  });

  let currentRoom = "";
  function joinRoom() {
    currentRoom = document.getElementById('roomName').value;
    document.getElementById('chatBox').innerHTML = `<b>${currentRoom} में स्वागत है</b>`;
    firebase.database().ref("chats/" + currentRoom).on("child_added", snap => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerText = snap.val().text;
        document.getElementById('chatBox').appendChild(div);
    });
  }

  function send() {
    const t = document.getElementById('msgInput').value;
    firebase.database().ref("chats/" + currentRoom).push({text: t});
    document.getElementById('msgInput').value = '';
  }
</script>
</body>
</html>
