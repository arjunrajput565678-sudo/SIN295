<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #e5ddd5; padding: 15px; }
    .card { max-width: 400px; margin: 30px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
    h2 { margin-bottom: 15px; color: #075e54; text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; outline: none; }
    button { width: 100%; padding: 10px; background: #075e54; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 5px; }
    button:hover { background: #128c7e; }
    .hidden { display: none; }
    .chat-box { height: 300px; padding: 10px; overflow-y: auto; background: #efeae2; border-radius: 5px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #dcf8c6; padding: 8px 12px; border-radius: 8px; max-width: 80%; align-self: flex-end; word-wrap: break-word; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .logout-btn { background: #d9534f; width: auto; padding: 5px 10px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- Login/Signup Screen -->
  <div id="authContainer" class="card">
    <h2 id="formTitle">लॉगिन करें</h2>
    <input type="email" id="email" placeholder="ईमेल आईडी">
    <input type="password" id="password" placeholder="पासवर्ड">
    <button onclick="authAction()" id="mainBtn">लॉगिन</button>
    <p style="text-align: center; margin-top: 10px; font-size: 14px;">
      <a href="#" onclick="toggleAuthMode()" id="toggleText">नया अकाउंट बनाएँ (Signup)</a>
    </p>
  </div>

  <!-- Chat Screen -->
  <div id="chatContainer" class="card hidden">
    <div class="top-bar">
      <span id="userEmail" style="font-size: 12px; color: #555;"></span>
      <button onclick="logout()" class="logout-btn">लॉगआउट</button>
    </div>
    <h2>माई चैट बॉक्स</h2>
    <div class="chat-box" id="chatBox"></div>
    <div style="display: flex; gap: 5px;">
      <input type="text" id="messageInput" placeholder="मैसेज लिखें...">
      <button onclick="sendMessage()" style="width: auto; padding: 10px 15px;">➤</button>
    </div>
  </div>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCdvQCtWPHCTiwOaxpNhm7I9pI9J6YkHj0",
      authDomain: "sin295.firebaseapp.com",
      databaseURL: "https://sin295-default-rtdb.firebaseio.com",
      projectId: "sin295",
      storageBucket: "sin295.firebasestorage.app",
      messagingSenderId: "563305243132",
      appId: "1:563305243132:web:04bcaa9499d1fe4c8f9279"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let isSignup = false;
    let currentUser = null;

    function toggleAuthMode() {
      isSignup = !isSignup;
      document.getElementById('formTitle').innerText = isSignup ? "नया अकाउंट बनाएँ" : "लॉगिन करें";
      document.getElementById('mainBtn').innerText = isSignup ? "साइन अप" : "लॉगिन";
      document.getElementById('toggleText').innerText = isSignup ? "पहले से अकाउंट है? लॉगिन करें" : "नया अकाउंट बनाएँ (Signup)";
    }

    function authAction() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) return alert("कृपया ईमेल और पासवर्ड भरें!");

      if (isSignup) {
        auth.createUserWithEmailAndPassword(email, password)
          .catch(err => alert("त्रुटि: " + err.message));
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => alert("त्रुटि: " + err.message));
      }
    }

    function logout() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('chatContainer').classList.remove('hidden');
        document.getElementById('userEmail').innerText = user.email;
        loadUserMessages(user.uid);
      } else {
        currentUser = null;
        document.getElementById('authContainer').classList.remove('hidden');
        document.getElementById('chatContainer').classList.add('hidden');
        document.getElementById('chatBox').innerHTML = '';
      }
    });

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text !== '' && currentUser) {
        database.ref("users/" + currentUser.uid + "/messages").push({
          text: text,
          timestamp: Date.now()
        });
        input.value = '';
      }
    }

    function loadUserMessages(uid) {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      database.ref("users/" + uid + "/messages").on("child_added", snapshot => {
        const data = snapshot.val();
        const msgElement = document.createElement('div');
        msgElement.className = 'msg';
        msgElement.innerText = data.text;
        chatBox.appendChild(msgElement);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }
  </script>
</body>
</html>
