<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>SIN295 Chat</title>
  <style>
    body, html { height: 100%; margin: 0; font-family: sans-serif; }
    /* बैकग्राउंड इमेज सेटिंग */
    body { 
      background: url('https://i.imgur.com/G5gT4jS.jpeg') no-repeat center center fixed; 
      background-size: cover;
      display: flex; justify-content: center; align-items: center;
    }
    .app-container { width: 100%; max-width: 400px; background: rgba(0, 0, 0, 0.85); color: white; border-radius: 15px; overflow: hidden; border: 1px solid #ffd700; }
    .header { background: #000; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; color: #ffd700; border-bottom: 2px solid #ffd700; }
    .box { padding: 20px; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; background: #333; color: white; }
    button { width: 100%; padding: 12px; background: #ffd700; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    .chat-box { height: 300px; overflow-y: auto; background: rgba(255, 255, 255, 0.1); padding: 10px; margin-top: 10px; }
    .msg { background: #222; padding: 8px; margin: 5px 0; border-radius: 8px; color: #fff; }
    .hidden { display: none; }
    .logout-btn { background: #ff4d4d; color: white; margin-top: 10px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">SIN295</div>

  <!-- लॉगिन/साइनअप सेक्शन -->
  <div id="authArea" class="box">
    <h2 id="title">लॉगिन</h2>
    <input type="email" id="email" placeholder="ईमेल">
    <input type="password" id="pass" placeholder="पासवर्ड">
    <button onclick="authAction()" id="mainBtn">लॉगिन</button>
    <p onclick="toggleAuth()" style="cursor:pointer; text-align:center; margin-top:10px; color:#ffd700;">अकाउंट नहीं है? साइन-अप</p>
  </div>

  <!-- चैट सेक्शन -->
  <div id="chatArea" class="box hidden">
    <div id="roomInputBox">
        <input type="text" id="roomName" placeholder="ग्रुप/रूम का नाम लिखें">
        <button onclick="joinRoom()">रूम में जुड़ें</button>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div style="display:flex; gap:5px; margin-top:10px;">
        <input type="text" id="msgInput" placeholder="मैसेज...">
        <button onclick="send()" style="width:auto;">➤</button>
    </div>
    <button onclick="logout()" class="logout-btn">लॉगआउट</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCdvQCtWPHCTiwOaxpNhm7I9pI9J6YkHj0",
    authDomain: "sin295.firebaseapp.com",
    databaseURL: "https://sin295-default-rtdb.firebaseio.com",
    projectId: "sin295",
    storageBucket: "sin295.firebasestorage.app",
    messagingSenderId: "563305243132",
    appId: "1:563305243132:web:04bcaa9499d1fe4c8f9279"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();
  
  let isSignup = false;
  let currentRoom = "";

  function toggleAuth() {
    isSignup = !isSignup;
    document.getElementById('title').innerText = isSignup ? "साइन-अप" : "लॉगिन";
    document.getElementById('mainBtn').innerText = isSignup ? "साइन-अप" : "लॉगिन";
  }

  function authAction() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    if(isSignup) auth.createUserWithEmailAndPassword(e, p).catch(err=>alert(err.message));
    else auth.signInWithEmailAndPassword(e, p).catch(err=>alert(err.message));
  }

  auth.onAuthStateChanged(user => {
    if(user) {
      document.getElementById('authArea').classList.add('hidden');
      document.getElementById('chatArea').classList.remove('hidden');
    } else {
      document.getElementById('authArea').classList.remove('hidden');
      document.getElementById('chatArea').classList.add('hidden');
    }
  });

  function joinRoom() {
    currentRoom = document.getElementById('roomName').value;
    document.getElementById('chatBox').innerHTML = "<b>" + currentRoom + " में आपका स्वागत है</b>";
    db.ref("chats/" + currentRoom).on("child_added", snap => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerText = snap.val().text;
        document.getElementById('chatBox').appendChild(div);
    });
  }

  function send() {
    const text = document.getElementById('msgInput').value;
    db.ref("chats/" + currentRoom).push({ text: text });
    document.getElementById('msgInput').value = '';
  }

  function logout() { auth.signOut(); }
</script>
</body>
</html>
